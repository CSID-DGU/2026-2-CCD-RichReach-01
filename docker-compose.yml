services:
  mysql:
    image: mysql:8.4
    container_name: richreach-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-richreach}
      MYSQL_USER: ${MYSQL_USER:-richreach}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD를 설정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 내 컴퓨터(127.0.0.1)에서만 접속되도록 제한한다. (같은 네트워크의 다른 기기에서 DB 접근 차단)
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1(TCP)로 확인해야 초기화용 임시 서버(소켓 전용)에 속지 않는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: richreach-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-richreach}
      MYSQL_USER: ${MYSQL_USER:-richreach}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CODEF_CLIENT_ID: ${CODEF_CLIENT_ID:-}
      CODEF_CLIENT_SECRET: ${CODEF_CLIENT_SECRET:-}
      CODEF_PUBLIC_KEY: ${CODEF_PUBLIC_KEY:-}
      # 응답 구조 진단 로그. 응답 구조를 확인할 때만 .env에서 true로 켠다. (값은 남기지 않고 결과 코드만 남긴다.)
      CODEF_DEBUG_LOGSHAPE: ${CODEF_DEBUG_LOGSHAPE:-false}
      # 시연용 샘플 데이터. 로컬 DB(Compose 안의 mysql)에서만 만들어지고 평소에는 꺼 둔다.
      DEMO_SEED_ON_STARTUP: ${DEMO_SEED_ON_STARTUP:-false}
      DEMO_SEED_USER_EMAIL: ${DEMO_SEED_USER_EMAIL:-}
      DEMO_SEED_RESET: ${DEMO_SEED_RESET:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql-data:
