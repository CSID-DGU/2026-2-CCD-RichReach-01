# 공용 개발 서버(AWS EC2)용. DB는 RDS MySQL을 쓰므로 mysql 서비스가 없다. 로컬 개발은 docker-compose.yml을 쓴다.
#
# 서버에서 한 번 준비:
#   1) 저장소를 받고 루트에 .env.dev를 만든다. (.env.dev는 커밋되지 않는다. 항목은 .env.example의 "개발 서버" 부분 참고)
#   2) 실행:  docker compose -f docker-compose.dev.yml up -d --build
#   3) 확인:  curl -fs http://localhost:8080/actuator/health
# 필수 값(DB_HOST, MYSQL_PASSWORD, DATA_ENCRYPTION_KEY, JWT_SECRET, CORS_ALLOWED_ORIGINS)이 빠지면 앱이 시작되지 않는다.
services:
  backend:
    build:
      context: ./backend
    image: richreach-backend:dev
    container_name: richreach-backend
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      # 80/443은 앞단(ALB 또는 nginx)이 받고, 앱은 서버 안에서만 연다.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
