# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# ---------------------------------------------------------------- #
# CodeRabbit AI 설정 (RichReach)
# - 기본 브랜치(develop) 대상 PR이 자동 리뷰 대상
# - 백엔드는 도메인별 패키지: controller / service / repository / entity / dto
#   (외부 API 연동은 client, plan 도메인의 OR-Tools 최적화는 optimizer)
# ---------------------------------------------------------------- #

language: "ko-KR"

# 톤 (최대 250자)
tone_instructions: >
  문제의 원인과 개선 방법을 구체적으로 함께 제시하세요.
  교육적으로 관련 개념이나 공식 문서를 추천하고, 비판보다 개선 제안을 우선하세요.
  칭찬은 짧게 하세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 세부 설정
# ---------------------------------------------------------------- #
reviews:
  profile: "chill"                  # 핵심 위주의 부드러운 리뷰 (더 엄격하게: assertive)
  request_changes_workflow: false   # 리뷰가 머지를 막지 않도록 (참고용)
  high_level_summary: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true        # PR에 연결된 이슈(Close #N)와 변경 내용이 맞는지 확인
  related_issues: false
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false

  auto_review:
    enabled: true
    drafts: false                   # draft PR은 리뷰하지 않음
    auto_incremental_review: true   # 추가 커밋 시 변경된 부분만 다시 리뷰
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    # develop → main PR도 리뷰하려면 주석 해제 (누적 diff가 커서 기본은 제외)
    # base_branches:
    #   - "main"

  # ---------------------------------------------------------------- #
  # 리뷰 제외 경로
  # ---------------------------------------------------------------- #
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!backend/gradle/wrapper/**"
    - "!backend/gradlew"
    - "!backend/gradlew.bat"
    - "!**/*.lock"
    - "!backend/src/main/resources/db/seed/**"   # 대량 기준 데이터
    - "!backend/src/test/resources/**"
    - "!docs/meeting/**"                          # 회의록

    # TODO(frontend): Flutter 프로젝트 생성 후, 리뷰가 필요 없는 파일을 제외
    #   - 자동 생성 파일: "!frontend/**/*.g.dart", "!frontend/**/*.freezed.dart", "!frontend/**/generated/**"
    #   - flutter create가 만드는 플랫폼 폴더 (웹/앱 결정에 맞춰 선택):
    #     "!frontend/android/**", "!frontend/ios/**", "!frontend/web/**",
    #     "!frontend/windows/**", "!frontend/macos/**", "!frontend/linux/**"

    # TODO(ai): AI 구조 확정 후, 리뷰가 필요 없는 파일을 제외
    #   - 노트북(JSON이라 리뷰가 시끄러움): "!ai/**/*.ipynb"
    #   - 데이터/모델 파일 폴더: "!ai/data/**", "!ai/models/**"

  # ---------------------------------------------------------------- #
  # 경로별 리뷰 지시사항
  # ---------------------------------------------------------------- #
  path_instructions:
    # ── controller ──
    - path: "backend/src/main/java/**/controller/**/*.java"
      instructions: >
        컨트롤러에는 비즈니스 로직이 없어야 하며 service로 위임만 해야 한다.
        Repository를 직접 호출하지 않는지 확인하라.
        응답은 공통 응답 포맷(`ApiResponse<T>`)으로 반환하는지 확인하라.
        Entity를 직접 반환하거나 받지 않는지, 요청 DTO에 `@Valid`와 검증 어노테이션이 있는지,
        API 경로가 `/api/v1/...` 규칙을 따르는지 확인하라.

    # ── dto ──
    - path: "backend/src/main/java/**/dto/**/*.java"
      instructions: >
        요청 DTO는 `*Request`, 응답 DTO는 `*Response` 네이밍을 따르는지 확인하라.
        Entity를 응답에 그대로 노출하지 않고 DTO로 변환하는지 확인하라.
        정적 팩토리 메서드는 인자 1개면 `from`, 2개 이상이면 `of`를 쓰는지 확인하라.
        금액 필드에 `double`/`float`를 쓰지 않았는지 확인하라.

    # ── service ──
    - path: "backend/src/main/java/**/service/**/*.java"
      instructions: >
        유스케이스와 비즈니스 흐름이 service에 있는지 확인하라.
        오류는 공통 예외(`BusinessException` + `ErrorCode`)로 던지고, 의미 없는 `RuntimeException`을
        그대로 던지지 않는지 확인하라.

        [트랜잭션]
        - 조회 후 수정/삭제하는 메서드에 `@Transactional`이 누락되지 않았는지 확인하라.
        - 조회 전용 메서드에는 `@Transactional(readOnly = true)`가 있는지 확인하라.
        - `@Transactional` 범위 안에 외부 API 호출(LLM 등), 최적화 계산(OR-Tools)처럼 오래 걸리는
          작업이 섞여 DB 커넥션을 오래 점유하지 않는지 확인하라. 섞여 있다면 트랜잭션 밖으로
          분리하거나 범위를 좁히도록 제안하라.
        - 같은 클래스 내부 메서드 호출(self-invocation)로 `@Transactional`이 무시되는 구조가 없는지 확인하라.

        [도메인 경계]
        - 다른 도메인(user, card, transaction, benefit, plan)의 Entity와 Repository를 직접 참조하지 않고
          ID 또는 해당 도메인의 service를 통해서만 호출하는지 확인하라.
        - 한 서비스가 여러 도메인의 책임을 한꺼번에 지거나 의존성이 과도하게(6~7개 이상)
          많다면 책임 분리를 제안하라.

    # ── entity ──
    - path: "backend/src/main/java/**/entity/**/*.java"
      instructions: >
        Entity가 controller, dto 같은 웹 계층 클래스에 의존하지 않는지 확인하라.
        Entity에 public setter를 두지 않고 의도가 드러나는 행위 메서드로 상태를 변경하는지 확인하라.
        Entity가 `BaseEntity`를 상속해 createdAt/updatedAt을 중복 선언하지 않는지 확인하라.
        금액은 `BigDecimal` 또는 `Long`(원 단위)을 쓰고 `double`/`float`를 쓰지 않는지 확인하라.
        JPA 연관관계에서 지연 로딩(LAZY)을 쓰는지, 양방향 연관관계가 불필요하게 늘어나지 않았는지 확인하라.
        도메인 간 연관관계는 Entity 참조 대신 ID로 참조하도록 제안하라.

    # ── client (외부 API 연동) ──
    - path: "backend/src/main/java/**/client/**/*.java"
      instructions: >
        LLM 등 외부 API 호출이 client 패키지에 있는지 확인하라.
        service가 client를 호출할 때 테스트에서 mock으로 대체할 수 있는 구조인지 확인하라.

        [외부 API 호출]
        - LLM 등 HTTP 호출에 connect/read timeout이 설정되어 있는지 확인하라.
        - 실패 시 재시도 정책과 예외 변환(외부 예외를 공통 예외로)이 있는지 확인하라.
        - API 키를 코드에 하드코딩하지 않고 환경변수(`${...}`)로 주입하는지 확인하라.
        - 요청/응답 로그에 API 키나 개인 금융정보가 남지 않는지 확인하라.

    # ── repository ──
    - path: "backend/src/main/java/**/repository/**/*.java"
      instructions: >
        N+1 문제(연관 엔티티 반복 조회)가 없는지, 필요한 곳에 fetch join 또는 배치 조회를 쓰는지 확인하라.
        페이징이 필요한 대량 조회에서 전체 조회를 하지 않는지 확인하라.
        조회 조건에 쓰이는 컬럼에 인덱스가 필요한지 확인하라.

    # ── optimizer (OR-Tools 최적화, plan 도메인) ──
    - path: "backend/src/main/java/**/optimizer/**/*.java"
      instructions: >
        최적화 입출력에 JPA Entity를 쓰지 않고 별도의 일반 객체(dto/record)를 쓰는지 확인하라.
        optimizer 안에서 Repository나 DB 접근을 하지 않는지 확인하라. (데이터는 service가 읽어서 전달)
        service가 인터페이스(예: `PlanOptimizer`)에 의존해서 테스트에서 가짜 구현으로 대체할 수 있는지 확인하라.
        solver에 시간 제한(time limit)이 있어서 계산이 무한정 길어지지 않는지 확인하라.
        같은 입력에 같은 결과가 나오도록 재현성을 확인하고, 결과가 불가능(infeasible)일 때의 처리가 있는지 확인하라.

    # ── global ──
    - path: "backend/src/main/java/**/global/**/*.java"
      instructions: >
        공통 예외 처리(`@RestControllerAdvice`)가 오류를 일관된 응답 포맷으로 변환하는지 확인하라.
        예외 응답에 스택 트레이스나 내부 정보가 노출되지 않는지 확인하라.
        CORS, Security 설정에서 운영 환경에 위험한 전체 허용(`*`) 설정이 없는지 확인하라.
        인증/인가 코드에서 토큰과 비밀키가 하드코딩되거나 로그로 남지 않는지 확인하라.

    # ── DB 마이그레이션 (Flyway) ──
    - path: "backend/src/main/resources/db/migration/**/*.sql"
      instructions: >
        이미 적용된 마이그레이션 파일을 수정하지 않고 새 버전 파일로 추가하는지 확인하라.
        파일명이 `V{버전}__{설명}.sql` 규칙을 따르는지 확인하라.
        데이터 손실 위험이 있는 변경(DROP, 컬럼 타입 축소, NOT NULL 추가)에는 데이터 이전 계획이
        있는지 확인하라. 외래키와 조회에 쓰이는 컬럼에 인덱스가 있는지 확인하라.
        금액 컬럼은 `DECIMAL` 또는 `BIGINT`를 쓰는지 확인하라.

    # ── 설정 파일 ──
    - path: "backend/src/main/resources/application*.yml"
      instructions: >
        DB 비밀번호, API 키 같은 시크릿이 값으로 직접 들어가 있지 않고 `${ENV_VAR}`로 참조되는지 확인하라.
        운영 설정에서 `ddl-auto`가 `validate`(또는 `none`)인지, 타임존이 `Asia/Seoul`인지,
        `open-in-view`가 false인지 확인하라. 운영 프로파일에서 SQL 로그나 debug 로그가 켜져 있지 않은지 확인하라.

    # ── 테스트 ──
    - path: "backend/src/test/**/*.java"
      instructions: >
        핵심 비즈니스 로직(혜택 계산, 월간 계획)에 경계값과 실패 케이스 테스트가 있는지 확인하라.
        LLM/외부 API는 실제 호출 대신 mock으로 대체했는지 확인하라.
        테스트 이름이 무엇을 검증하는지 드러나는지, 현재 시각에 의존해 실행 시점마다 결과가
        달라지는 테스트가 없는지(`Clock` 주입 등) 확인하라.

    # ── 인프라 / CI ──
    - path: "backend/Dockerfile"
      instructions: >
        OR-Tools 네이티브 라이브러리 때문에 alpine(musl) 이미지를 쓰지 않는지 확인하라.
        비밀번호나 API 키가 이미지에 들어가지 않는지, root가 아닌 사용자로 실행하는지 확인하라.

    - path: "docker-compose.yml"
      instructions: >
        DB 비밀번호가 하드코딩되지 않고 환경변수(`.env`)로 주입되는지 확인하라.
        MySQL healthcheck가 있고 backend가 `service_healthy` 조건으로 기다리는지 확인하라.

    - path: ".github/workflows/**"
      instructions: >
        `permissions`가 최소 권한으로 지정되어 있는지, Secrets를 로그에 출력하지 않는지 확인하라.
        `paths` 필터와 `concurrency` 설정이 의도에 맞는지 확인하라.

    # ── frontend (TODO: Flutter 구조/플랫폼 확정 후 아래를 참고해 추가) ──
    # 추가할 때는 path에 실제 폴더 구조를 반영하세요. (예: "frontend/lib/**/*.dart")
    # 넣을 만한 리뷰 지시:
    #   - [비동기/생명주기] await 이후 BuildContext 사용(mounted 확인), controller/subscription의 dispose
    #   - [구조] UI 위젯 안에 API 호출·비즈니스 로직 금지(상태관리/repository로 분리),
    #            팀이 채택한 상태관리 방식과의 일관성, const 생성자, build 메서드 길이
    #   - [금액] double 오차 방지 (정수 원 단위 또는 별도 타입)
    #   - [API/보안] API 주소·키 하드코딩 금지(--dart-define 등으로 주입),
    #                LLM 키 같은 서버 전용 시크릿이 클라이언트에 없는지,
    #                토큰·금융정보 print/debugPrint 금지, 네트워크 timeout과 오류 상태 처리
    #   - [웹 확정 시] CORS와 토큰 저장 방식(백엔드와 맞춰야 함)
    # 예시 형태:
    # - path: "frontend/lib/**/*.dart"
    #   instructions: >
    #     (위 항목을 "~하는지 확인하라" 문장으로 작성)
    # - path: "frontend/pubspec.yaml"
    #   instructions: "새 패키지가 꼭 필요한지, 유지보수가 활발한지, 버전이 명시되어 있는지 확인하라."

    # ── ai (TODO: 언어/구조/연동 방식 확정 후 아래를 참고해 추가) ──
    # 추가할 때는 path에 실제 폴더 구조를 반영하세요. (예: "ai/app/**/*.py")
    # 구조가 정해지면 내용을 다시 확인하고, 아래 "예시 형태"를 참고해 항목을 추가하세요.
    # 넣을 만한 리뷰 지시:
    #   - [시크릿/데이터] API 키 하드코딩 금지(환경변수 주입), 대용량 데이터·모델 가중치·개인정보 커밋 금지,
    #                     외부 LLM에 보내는 데이터의 개인정보/카드번호 마스킹
    #   - [LLM 호출] timeout·재시도·fallback, 프롬프트 인젝션(사용자 입력을 그대로 이어 붙이지 않기),
    #                LLM 응답의 형식/범위 검증, 호출 비용 폭증(반복 호출) 방지
    #   - [재현성] 시드·입력·버전 기록으로 실행마다 결과가 달라지지 않게
    #   - [연동] 백엔드가 호출하는 요청/응답 형식이 docs/api/ 명세와 일치하는지
    #            (백엔드 plan/client, plan/optimizer에서 LLM·OR-Tools를 직접 호출하는 부분은 backend/**의 client/optimizer 지시가 담당하므로,
    #             ai/에는 ai/ 코드 자체에 해당하는 내용만 넣기)
    # 예시 형태:
    # - path: "ai/**"
    #   instructions: >
    #     (위 항목을 "~하는지 확인하라" 문장으로 작성)

    # ── 문서 ──
    - path: "docs/**"
      instructions: "오탈자와 팀 컨벤션(브랜치, 커밋 규칙) 위반 여부만 가볍게 확인하라."

  # ---------------------------------------------------------------- #
  # 보조 도구 (린터/보안 검사)
  # ---------------------------------------------------------------- #
  tools:
    gitleaks:
      enabled: true                 # 시크릿(키, 비밀번호) 커밋 탐지
    actionlint:
      enabled: true                 # GitHub Actions 워크플로 문법 검사
    hadolint:
      enabled: true                 # Dockerfile 검사
    # TODO(ai): AI를 Python으로 정하면 아래 주석을 해제 (린터)
    # ruff:
    #   enabled: true
    markdownlint:
      enabled: false                # 문서 스타일 지적은 소음이 커서 끔

# ---------------------------------------------------------------- #
# 채팅
# ---------------------------------------------------------------- #
chat:
  auto_reply: true

# ---------------------------------------------------------------- #
# 지식 기반
# ---------------------------------------------------------------- #
knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:                   # 팀 컨벤션 문서를 리뷰 기준으로 참고
      - "docs/convention/**/*.md"
      - "README.md"
