# 로컬 개발용 설정. 시크릿은 값을 직접 쓰지 않고 환경변수(.env)로 주입한다.
# - IDE/gradlew로 앱만 실행: DB_HOST 기본값(localhost)과 DB_PORT(3307)로 접속
# - docker compose로 실행: compose가 DB_HOST=mysql, DB_PORT=3306을 넘겨준다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE:richreach}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:richreach}
    password: ${MYSQL_PASSWORD}

richreach:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# CODEF 연동 (값은 .env에서 주입한다. 비어 있으면 CODEF 호출 시 안내 오류가 난다.)
codef:
  client-id: ${CODEF_CLIENT_ID:}
  client-secret: ${CODEF_CLIENT_SECRET:}
  public-key: ${CODEF_PUBLIC_KEY:}   # 카드사 비밀번호 암호화용 RSA 공개키

logging:
  level:
    org.hibernate.SQL: debug
