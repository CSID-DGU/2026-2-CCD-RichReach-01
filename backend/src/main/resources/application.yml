spring:
  application:
    name: RichReach

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 관리하고 Hibernate는 검증만 한다
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

  flyway:
    enabled: true

# 로그인 토큰(JWT). secret은 32바이트 이상이어야 하고, 비워 두면 실행할 때마다 임시 키를 만든다.
# (임시 키는 서버를 다시 켜면 모든 로그인이 풀리므로 운영에서는 JWT_SECRET을 반드시 설정한다.)
app:
  jwt:
    issuer: richreach
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    secret: ${JWT_SECRET:}
  # 로그인 실패 잠금: max-failures번 연속으로 틀리면 lock-duration 동안 로그인할 수 없다.
  auth:
    login-lock:
      max-failures: 5
      lock-duration: 10m
  # 현재 약관 버전. 약관 본문은 앱에 있고 서버는 동의한 버전만 기록한다. 약관을 고치면 이 값을 바꾼다.
  terms:
    signup-version: 2026-10-01

# 카드 혜택 CSV 스테이징 적재. 평소에는 꺼 두고, 적재할 때만 환경변수로 켠다. (StagingRunner 참고)
richreach:
  staging:
    load-on-startup: ${STAGING_LOAD_ON_STARTUP:false}
    csv-dir: ${STAGING_CSV_DIR:}

# DB 접속 정보(spring.datasource.*)는 프로파일별 설정(application-local.yml 등)에서 환경변수로 주입한다.

management:
  endpoints:
    web:
      exposure:
        include: health
