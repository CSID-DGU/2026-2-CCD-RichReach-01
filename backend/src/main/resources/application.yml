spring:
  application:
    name: RichReach

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 관리하고 Hibernate는 검증만 한다
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

  flyway:
    enabled: true

# DB 접속 정보(spring.datasource.*)는 프로파일별 설정(application-local.yml 등)에서 환경변수로 주입한다.

management:
  endpoints:
    web:
      exposure:
        include: health
